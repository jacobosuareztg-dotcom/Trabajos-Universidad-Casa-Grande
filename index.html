<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aventuras Sociales con Mauricio - Escenas Animadas TEA</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg-cream: #F5F2EA;
      --card-bg: #FFFFFF;
      --primary: #1F4E46;
      --primary-light: #E2EFEA;
      --secondary: #E07A5F;
      --accent-blue: #2B6CB0;
      --success: #227038;
      --success-bg: #E6F6EC;
      --warning: #975A00;
      --warning-bg: #FFF8E1;
      --text-dark: #1E293B;
      --text-muted: #475569;
      --border: #CBD5E1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #F5F2EA 0%, #EAE5D9 100%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px;
      overflow-x: hidden;
    }

    /* Keyframes de animación cinematográfica suave */
    @keyframes walkApproach {
      0%, 100% { transform: translateX(0px) translateY(0px); }
      25% { transform: translateX(10px) translateY(-4px); }
      50% { transform: translateX(22px) translateY(0px); }
      75% { transform: translateX(10px) translateY(-4px); }
    }

    @keyframes blockDrop {
      0%, 100% { transform: translateY(0px); }
      40% { transform: translateY(-16px); }
      60% { transform: translateY(0px); }
      75% { transform: translateY(-4px); }
    }

    @keyframes kickArc {
      0% { transform: translate(0px, 0px) rotate(0deg); }
      45% { transform: translate(65px, -45px) rotate(180deg); }
      75% { transform: translate(115px, -10px) rotate(320deg); }
      100% { transform: translate(0px, 0px) rotate(360deg); }
    }

    @keyframes netShake {
      0%, 65%, 100% { transform: translateX(0); }
      75% { transform: translateX(5px); }
      85% { transform: translateX(-3px); }
    }

    @keyframes talkWave {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }

    @keyframes signalBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes spinTrophy {
      0%, 100% { transform: rotate(-6deg) scale(1); }
      50% { transform: rotate(6deg) scale(1.1); }
    }

    @keyframes celebrateJump {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-16px) scale(1.08); }
    }

    @keyframes cloudDrift {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(18px); }
    }

    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.82); }
      70% { transform: scale(1.04); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes gentleShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      75% { transform: translateX(7px); }
    }

    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg) scale(1); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg) scale(0.8); opacity: 0; }
    }

    .anim-walk { animation: walkApproach 4.2s ease-in-out infinite; }
    .anim-block { animation: blockDrop 2.6s ease-in-out infinite; }
    .anim-kick { animation: kickArc 3.4s ease-in-out infinite; }
    .anim-net { animation: netShake 3.4s ease-in-out infinite; }
    .anim-talk { animation: talkWave 2s ease-in-out infinite; transform-origin: center; }
    .anim-blink { animation: signalBlink 1.8s ease-in-out infinite; }
    .anim-float { animation: floatSlow 3.2s ease-in-out infinite; }
    .anim-trophy { animation: spinTrophy 2.5s ease-in-out infinite; transform-origin: center; }
    .anim-cloud { animation: cloudDrift 7s ease-in-out infinite; }
    .scene-solved .celebrate-target { animation: celebrateJump 0.9s ease-in-out infinite !important; }

    header {
      width: 100%;
      max-width: 980px;
      background: var(--card-bg);
      border-radius: 22px;
      padding: 14px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.07);
      margin-bottom: 18px;
      border-left: 10px solid var(--primary);
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-badge {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--primary-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.1rem;
      border: 3px solid var(--primary);
      animation: floatSlow 3s ease-in-out infinite;
    }

    .brand h1 {
      font-size: 1.35rem;
      color: var(--primary);
    }

    .brand p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stars-bar {
      background: #FFF9E6;
      border: 2px solid #F6C344;
      color: #8A5A00;
      padding: 7px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.2s;
    }

    button:active {
      transform: scale(0.96);
    }

    .btn-qr, .btn-home {
      padding: 10px 15px;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-qr { background-color: var(--accent-blue); color: #fff; }
    .btn-home { background-color: var(--primary-light); color: var(--primary); }

    main {
      width: 100%;
      max-width: 980px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      animation: slideUpFade 0.4s ease-out;
    }

    .audio-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #EAF4F1;
      border: 2px solid #B7D8CE;
      padding: 14px 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .audio-text {
      font-size: 1.18rem;
      line-height: 1.5;
      color: var(--text-dark);
      flex: 1;
      font-weight: 600;
    }

    .btn-speak {
      background-color: var(--secondary);
      color: #fff;
      padding: 12px 20px;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(224, 122, 95, 0.35);
      white-space: nowrap;
    }

    .btn-speak.speaking {
      animation: talkWave 0.8s infinite;
      background-color: #1F4E46;
    }

    /* Map Grid */
    .world-section {
      margin-bottom: 24px;
    }

    .world-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      color: var(--primary);
      background: var(--primary-light);
      padding: 10px 16px;
      border-radius: 12px;
      margin-bottom: 14px;
    }

    .stories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .story-card {
      background: #FAFAF8;
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .story-card:hover {
      border-color: var(--primary);
      transform: translateY(-4px);
      box-shadow: 0 10px 22px rgba(31, 78, 70, 0.14);
    }

    .story-card.completed {
      border-color: var(--success);
      background: var(--success-bg);
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .story-icon {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      background: #E2ECE9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.3rem;
      flex-shrink: 0;
      animation: floatSlow 3.5s ease-in-out infinite;
    }

    .story-card h3 {
      font-size: 1.12rem;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .skill-tag {
      display: inline-block;
      background: #E2E8F0;
      color: #334155;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 10px;
    }

    .btn-start {
      margin-top: auto;
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      font-size: 1rem;
    }

    /* Animated Visual Stage */
    .visual-stage {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 18px;
      background: #F8FAFC;
      border: 2px solid #CBD5E1;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 20px;
      align-items: center;
      animation: popIn 0.45s ease-out;
    }

    @media (max-width: 760px) {
      .visual-stage {
        grid-template-columns: 1fr;
      }
    }

    .scene-box {
      background: #FFFFFF;
      border-radius: 16px;
      padding: 8px;
      border: 3px solid #D8E2EC;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.04);
      overflow: hidden;
    }

    .scene-box svg {
      width: 100%;
      max-height: 235px;
      border-radius: 12px;
      display: block;
    }

    .picto-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .picto-panel-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      text-align: center;
      background: var(--primary-light);
      padding: 7px;
      border-radius: 10px;
    }

    .pictogram-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .picto-box {
      background: #fff;
      border: 2px solid var(--primary);
      border-radius: 14px;
      padding: 10px 6px;
      text-align: center;
      animation: popIn 0.5s ease-out both;
    }

    .picto-box:nth-child(1) { animation-delay: 0.1s; }
    .picto-box:nth-child(2) { animation-delay: 0.25s; }
    .picto-box:nth-child(3) { animation-delay: 0.4s; }

    .picto-step {
      font-size: 0.72rem;
      font-weight: 800;
      color: #fff;
      background: var(--secondary);
      border-radius: 8px;
      padding: 1px 6px;
      display: inline-block;
      margin-bottom: 4px;
    }

    .picto-box span.emoji {
      font-size: 2.1rem;
      display: block;
      margin-bottom: 4px;
      animation: floatSlow 3s ease-in-out infinite;
    }

    .picto-box strong {
      font-size: 0.84rem;
      color: var(--primary);
      display: block;
      line-height: 1.2;
    }

    /* Options */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-row {
      display: flex;
      gap: 10px;
      align-items: stretch;
      animation: slideUpFade 0.45s ease-out both;
    }

    .option-row:nth-child(1) { animation-delay: 0.15s; }
    .option-row:nth-child(2) { animation-delay: 0.28s; }
    .option-row:nth-child(3) { animation-delay: 0.4s; }

    .option-btn {
      flex: 1;
      background: #FFFFFF;
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      font-size: 1.1rem;
      color: var(--text-dark);
    }

    .option-btn:hover {
      border-color: var(--accent-blue);
      background: #F0F8FF;
      transform: translateX(5px);
    }

    .option-emoji {
      font-size: 2.1rem;
      background: #F1F5F9;
      padding: 8px;
      border-radius: 12px;
      flex-shrink: 0;
    }

    .btn-opt-audio {
      background: #E2E8F0;
      color: var(--text-dark);
      padding: 0 16px;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Feedback */
    .feedback-box {
      margin-top: 20px;
      padding: 18px;
      border-radius: 16px;
      display: none;
      align-items: center;
      gap: 16px;
      font-size: 1.12rem;
      line-height: 1.5;
    }

    .feedback-box.success {
      display: flex;
      background: var(--success-bg);
      border: 3px solid var(--success);
      color: #14532D;
      animation: popIn 0.4s ease-out;
    }

    .feedback-box.retry {
      display: flex;
      background: var(--warning-bg);
      border: 3px solid #F59E0B;
      color: #78350F;
      animation: gentleShake 0.45s ease-in-out;
    }

    .feedback-icon {
      font-size: 3rem;
      flex-shrink: 0;
      animation: celebrateJump 1.1s ease infinite;
    }

    .btn-next {
      margin-top: 12px;
      padding: 12px 22px;
      background: var(--success);
      color: #fff;
      font-size: 1.05rem;
      display: none;
    }

    .diploma-box {
      background: linear-gradient(135deg, #FFFBEB 0%, #E7F6EC 100%);
      border: 3px solid #F59E0B;
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      margin-bottom: 22px;
      animation: popIn 0.6s ease-out;
    }

    .confetti-piece {
      position: fixed;
      top: -20px;
      font-size: 1.9rem;
      pointer-events: none;
      z-index: 200;
      animation: confettiFall 2.8s linear forwards;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-content {
      background: #fff;
      padding: 26px;
      border-radius: 20px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      animation: popIn 0.3s ease-out;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin: 18px 0;
    }
  </style>
</head>

      classHelp: `<svg id="activeSceneSVG" viewBox="0 0 420 230" xmlns="http://www.w3.org/2000/svg">

    // Efectos sonoros suaves (Web Audio API sin archivos externos)
    function playChime(isSuccess) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const now = ctx.currentTime;
        const notes = isSuccess ? [523.25, 659.25, 783.99, 1046.5] : [392.00, 349.23];
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.12);
          gain.gain.setValueAtTime(0.12, now + i * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.12);
          osc.stop(now + i * 0.12 + 0.36);
        });
      } catch (e) {}
    }

    function speak(text, btnElement = null) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        document.querySelectorAll('.speaking').forEach(b => b.classList.remove('speaking'));
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'es-ES';
        u.rate = 0.92;
        if (btnElement) {
          btnElement.classList.add('speaking');
          u.onend = () => btnElement.classList.remove('speaking');
        }
        window.speechSynthesis.speak(u);
      }
    }

    function launchCelebration() {
      const symbols = ['⭐', '🌟', '🎉', '✨', '🎊'];
      for (let i = 0; i < 20; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.textContent = symbols[i % symbols.length];
        piece.style.left = Math.random() * 94 + 'vw';
        piece.style.animationDuration = (2 + Math.random() * 1.4) + 's';
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 3500);
      }
    }

    function checkAnswer(actId, optIdx) {
      const act = allActivities.find(a => a.id === actId);
      const opt = act.options[optIdx];
      const fbBox = document.getElementById('feedbackBox');
      const fbIcon = document.getElementById('feedbackIcon');
      const fbText = document.getElementById('feedbackText');
      const btnNext = document.getElementById('btnNext');
      const sceneContainer = document.getElementById('sceneContainer');

      fbBox.className = 'feedback-box';
      void fbBox.offsetWidth;

      fbText.textContent = opt.feedback;
      playChime(opt.correct);
      setTimeout(() => speak(opt.feedback), 350);

      if (opt.correct) {
        fbBox.classList.add('success');
        fbIcon.textContent = '🌟';
        btnNext.style.display = 'inline-block';
        sceneContainer.classList.add('scene-solved');
        completedSet.add(actId);
        updateHeader();
        launchCelebration();
      } else {
        fbBox.classList.add('retry');
        fbIcon.textContent = '💡';
        btnNext.style.display = 'none';
        sceneContainer.classList.remove('scene-solved');
      }
    }
